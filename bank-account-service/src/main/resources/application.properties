spring.application.name=bank-account-service
spring.datasource.url=jdbc:h2:mem:account-db
spring.h2.console.enabled=true
server.port=8081

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Data REST base path
spring.data.rest.base-path=/data-rest

# Disable springdoc data-rest integration (SpringDocDataRestConfiguration references
# org.springframework.boot.hateoas.autoconfigure.HateoasProperties which does not
# exist in Spring Boot 4.1.1 — the class moved between the Boot 4.x milestone
# that springdoc 3.0.0 was compiled against and the GA release)
springdoc.enable-data-rest=false
springdoc.enable-hateoas=false
